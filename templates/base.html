{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plant Doctor{% endblock %}</title>

    <!-- Tailwind via CDN — fine for dev; swap for a compiled build before production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F4F6F0; }
        /* Custom scrollbar + drag-active state used by scan.html */
        .drop-zone.drag-active { border-color: #4E9F3D; background-color: #eaf5e6; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col text-gray-800">

    {% include "partials/navbar.html" %}
    {% include "partials/messages.html" %}

    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>
